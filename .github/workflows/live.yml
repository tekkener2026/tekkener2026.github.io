name: build live list

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0,10,20 * * *"

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Build live.m3u
        run: node .github/scripts/live.mjs > live.m3u
      - name: Publish to gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('live.m3u', 'utf8');
            let sha;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'live.m3u',
                ref: 'gh-pages'
              });
              sha = res.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'live.m3u',
              message: 'chore: 更新筛活清单',
              content: Buffer.from(content, 'utf8').toString('base64'),
              branch: 'gh-pages'
            };
            if (sha) params.sha = sha;
            const out = await github.rest.repos.createOrUpdateFileContents(params);
            core.info('published ' + out.data.commit.sha)
